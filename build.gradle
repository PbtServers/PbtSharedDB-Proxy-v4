plugins { id 'base' }
allprojects {
    group = 'com.pbtservers'
    version = '1.0.0'
    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}
subprojects {
    apply plugin: 'java-library'
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
    java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
    dependencyLocking { lockAllConfigurations() }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
        testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.named('test', Test) { useJUnitPlatform { excludeTags 'integration' } }
}
tasks.register('distributions', Sync) {
    dependsOn ':proxy:jar', ':client:jar'
    into layout.buildDirectory.dir('distributions')
    from project(':proxy').tasks.named('jar')
    from project(':client').tasks.named('jar')
    doLast {
        def expected = ['PbtSharedDB-Proxy-1.0.0.jar', 'PbtSharedDB-Client-1.0.0.jar'] as Set
        if ((destinationDir.list() as Set) != expected) throw new GradleException('La distribución debe contener exactamente los dos plugins')
        expected.each { name ->
            new java.util.zip.ZipFile(new File(destinationDir, name)).withCloseable { archive ->
                if (archive.getEntry('com/pbtservers/sharedb/DiscoveryProtocol.class') == null || archive.getEntry('com/pbtservers/sharedb/SafeFiles.class') == null)
                    throw new GradleException('Faltan clases de common dentro del plugin')
                def descriptor = name.contains('-Proxy-') ? 'velocity-plugin.json' : 'plugin.yml'
                if (archive.getEntry(descriptor) == null) throw new GradleException('Falta el descriptor del plugin')
                ['org/mariadb/jdbc/Driver.class', 'org/yaml/snakeyaml/Yaml.class'].each { dependency ->
                    if (archive.getEntry(dependency) == null) throw new GradleException("Falta dependencia interna: ${dependency}")
                }
                if (name.contains('-Client-') && archive.getEntry('com/pbtservers/sharedb/PbtSharedDB.class') != null)
                    throw new GradleException('El cliente no debe empaquetar la implementación del proxy')
            }
        }
    }
}
tasks.named('build') { dependsOn ':common:build', ':proxy:build', ':client:build', 'distributions' }
tasks.named('check') { dependsOn ':common:check', ':proxy:check', ':client:check' }
tasks.register('integrationTest') { dependsOn ':proxy:integrationTest', ':client:integrationTest' }
wrapper { gradleVersion = '9.1.0'; distributionType = Wrapper.DistributionType.BIN }
